<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ระบบจัดการราคารับซื้อ - v1.6.2 (แก้ไข Matrix ได้)</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background: #f0f4f8; padding: 20px; color: #1a202c; }
        .container { max-width: 1600px; margin: 0 auto; }
        .card { background: white; border-radius: 24px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        h2 { font-size: 1.5rem; color: #2d3748; border-left: 6px solid #38a169; padding-left: 15px; margin-bottom: 25px; }
        
        .flex-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
        .flex-between { justify-content: space-between; align-items: center; }
        .settings-bar { background: #f8fafc; border-radius: 20px; padding: 20px; margin-bottom: 24px; border: 1px solid #edf2f7; }
        .form-group { display: flex; flex-direction: column; gap: 6px; min-width: 120px; }
        label { font-weight: 700; font-size: 0.8rem; color: #4a5568; }
        
        input, select { padding: 10px 16px; border-radius: 12px; border: 1.5px solid #e2e8f0; background: white; font-size: 0.9rem; transition: all 0.2s; }
        input:focus, select:focus { outline: none; border-color: #38a169; box-shadow: 0 0 0 3px rgba(56, 161, 105, 0.1); }
        
        button { background: #38a169; color: white; border: none; padding: 12px 24px; border-radius: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        button:hover { background: #2f855a; transform: translateY(-1px); }
        button.btn-outline { background: white; border: 1.5px solid #38a169; color: #38a169; }
        button.btn-outline:hover { background: #f0fff4; }
        
        .product-table-wrapper { overflow-x: auto; border-radius: 16px; border: 1px solid #e2e8f0; background: white; }
        .product-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 1300px; }
        .product-table th, .product-table td { padding: 14px 10px; border-bottom: 1px solid #edf2f7; text-align: left; }
        .product-table th { background: #f7fafc; font-weight: 700; color: #4a5568; position: sticky; top: 0; z-index: 10; }
        
        .price-input { width: 110px; font-weight: 700; color: #2f855a; border-color: #c6f6d5; background: #f0fff4; text-align: right; }
        .tier-input { width: 100px; text-align: right; }
        
        .matrix-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; border: 1px solid #e2e8f0; }
        .matrix-table input { 
            width: 55px; padding: 2px 4px; border: 1px solid transparent; 
            background: transparent; text-align: right; font-size: 0.75rem; 
        }
        .matrix-table input:hover { border-color: #cbd5e0; background: white; }
        .matrix-table input:focus { border-color: #38a169; background: white; outline: none; }
        .matrix-table th { background: #edf2f7; padding: 4px; border: 1px solid #e2e8f0; }
        .matrix-table td { padding: 2px; border: 1px solid #e2e8f0; text-align: center; }
        .weight-range { background: #fffaf0; color: #9c4221; font-weight: 700; min-width: 65px; }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-content { background: white; border-radius: 24px; padding: 30px; max-width: 900px; width: 95%; max-height: 85vh; overflow-y: auto; }
        .hidden { display: none; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2d3748; color: white; padding: 12px 30px; border-radius: 50px; display: none; z-index: 2000; }
    </style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="container">
    <div class="card">
        <div class="flex-row flex-between" style="margin-bottom: 20px;">
            <h2>📊 ระบบจัดการราคารับซื้อ (v1.6.2 แก้ไข Matrix ได้)</h2>
            <div class="flex-row">
                <button id="manageFormulasBtn" class="btn-outline" style="color:#38a169; background:white; border:1px solid #38a169;">⚙️ สูตรน้ำหนักกลาง</button>
                <button id="saveToSheetsBtn" style="background: #38a169;">📤 บันทึกไป Sheets</button>
            </div>
        </div>

        <div class="settings-bar">
            <div class="flex-row">
                <div class="form-group"><label>🔍 ค้นหา</label><input type="text" id="searchProduct" placeholder="ชื่อสินค้า..."></div>
                <div class="form-group"><label>📂 กรองหมวด</label><select id="categoryFilterSelect"><option value="all">ทั้งหมด</option></select></div>
                <button id="loadFromSheetsBtn" style="background: #4299e1;">📥 โหลดข้อมูลใหม่</button>
                <button id="refreshBtn" style="background: #cbd5e0; color: #4a5568;">⟳ รีเฟรชหน้า</button>
            </div>
        </div>

        <div class="product-table-wrapper">
            <table class="product-table">
                <thead>
                    <tr>
                        <th>สินค้า</th>
                        <th style="width: 140px;">สูตรน้ำหนัก</th>
                        <th>ราคา A (ฐาน)</th>
                        <th>B</th>
                        <th>C</th>
                        <th>D</th>
                        <th>Walk</th>
                        <th style="width: 400px;">📊 ตารางราคาตามน้ำหนัก (แก้ไขเองได้)</th>
                    </tr>
                </thead>
                <tbody id="productList"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="formulaManagerModal" class="modal hidden">
    <div class="modal-content">
        <h3>📐 ตั้งค่าสูตรน้ำหนักกลาง (Master Formulas)</h3>
        <p style="font-size:0.8rem; color:#666; margin-bottom:15px;">การแก้ไขที่นี่จะเปลี่ยนโครงสร้างช่วงน้ำหนักของสินค้าที่ใช้สูตรนี้</p>
        <div id="formulaListArea"></div>
        <button id="addFormulaBtn" style="background: #4299e1; margin-top: 15px;">➕ เพิ่มสูตรใหม่</button>
        <div class="flex-row" style="justify-content: flex-end; margin-top: 25px;">
            <button id="closeFormulaModalBtn">ตกลงและปิด</button>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbyd9EnnHlG4yH_tPPaXAk3AvW5Ieg8FCOcPUf01lnAC889lL6pCEZSbvtgmSs7Ny_YZJA/exec';

    let categories = [];
    let volumeFormulas = [];
    let products = [];
    let currentCategoryFilter = "all";

    function showToast(m) { 
        const t = document.getElementById('toast'); 
        if(t) {
            t.innerText=m; 
            t.style.display='block'; 
            setTimeout(()=>t.style.display='none',2000); 
        }
    }

    function getTierPrice(product, tier) {
        const field = 'price' + tier;
        if (product[field] !== undefined && product[field] !== null && product[field] !== "" && product[field] !== 0) return parseFloat(product[field]);
        const cat = categories.find(c => c.id === product.categoryId);
        const priceA = parseFloat(product.priceA) || 0;
        if(!cat) return priceA;
        const d = cat.discounts || { b:0, c:0, d:0, walking:0 };
        const disc = (tier === 'Walking') ? d.walking : d[tier.toLowerCase()];
        return Math.max(0, priceA - (parseFloat(disc) || 0));
    }

    function buildEditableMatrix(product) {
        const formula = volumeFormulas.find(f => f.id === product.formulaId);
        if(!formula || !formula.breaks || !formula.breaks.length) return '<div style="color:#ccc;">ไม่ได้เลือกสูตร</div>';
        if (!product.matrixOverrides) product.matrixOverrides = {};

        let html = `<table class="matrix-table"><thead><tr><th>น้ำหนัก</th><th>A</th><th>B</th><th>C</th><th>D</th><th>W</th></tr></thead><tbody>`;
        const tiers = ['A','B','C','D','Walking'];
        
        formula.breaks.forEach((br) => {
            const rangeKey = `${br.min}-${br.max}`;
            const rangeText = br.max >= 999999 ? `> ${br.min}` : `${br.min}-${br.max}`;
            html += `<tr><td class="weight-range">${rangeText}</td>`;
            
            tiers.forEach(tier => {
                const overrideKey = `${rangeKey}_${tier}`;
                let displayPrice;
                if (product.matrixOverrides[overrideKey] !== undefined) {
                    displayPrice = product.matrixOverrides[overrideKey];
                } else {
                    const baseTierPrice = (tier === 'A') ? parseFloat(product.priceA) : getTierPrice(product, tier);
                    displayPrice = Math.max(0, baseTierPrice - (parseFloat(br.discountBaht) || 0)).toFixed(2);
                }
                html += `<td><input type="number" step="0.01" data-pid="${product.id}" data-key="${overrideKey}" class="matrix-edit-input" value="${displayPrice}"></td>`;
            });
            html += `</tr>`;
        });
        html += `</tbody></table>`;
        return html;
    }

    function renderProducts() {
        const searchInput = document.getElementById('searchProduct');
        const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';
        const tbody = document.getElementById('productList');
        if(!tbody) return;

        let filtered = products.filter(p => {
            if (currentCategoryFilter !== "all" && p.categoryId !== currentCategoryFilter) return false;
            return p.name.toLowerCase().includes(searchTerm);
        });

        tbody.innerHTML = filtered.map(p => `
            <tr>
                <td><b>${p.name}</b><br><small style="color:#666">${categories.find(c=>c.id===p.categoryId)?.name || ''}</small></td>
                <td>
                    <select class="formula-select" data-id="${p.id}">
                        <option value="">-- ไม่ใช้สูตร --</option>
                        ${volumeFormulas.map(f => `<option value="${f.id}" ${f.id === p.formulaId ? 'selected' : ''}>${f.name}</option>`).join('')}
                    </select>
                </td>
                <td><input type="number" class="price-input" data-id="${p.id}" data-tier="A" value="${p.priceA || 0}"></td>
                <td><input type="number" class="tier-input" data-id="${p.id}" data-tier="B" value="${getTierPrice(p, 'B').toFixed(2)}"></td>
                <td><input type="number" class="tier-input" data-id="${p.id}" data-tier="C" value="${getTierPrice(p, 'C').toFixed(2)}"></td>
                <td><input type="number" class="tier-input" data-id="${p.id}" data-tier="D" value="${getTierPrice(p, 'D').toFixed(2)}"></td>
                <td><input type="number" class="tier-input" data-id="${p.id}" data-tier="Walking" value="${getTierPrice(p, 'Walking').toFixed(2)}"></td>
                <td>${buildEditableMatrix(p)}</td>
            </tr>
        `).join('');
        attachEvents();
    }

    function attachEvents() {
        document.querySelectorAll('.price-input, .tier-input').forEach(inp => {
            inp.onchange = (e) => {
                const p = products.find(x => x.id === e.target.dataset.id);
                const tier = e.target.dataset.tier;
                if(tier === 'A') p.priceA = e.target.value;
                else p['price'+tier] = e.target.value;
                p.matrixOverrides = {}; 
                renderProducts();
            };
        });

        document.querySelectorAll('.matrix-edit-input').forEach(inp => {
            inp.onchange = (e) => {
                const p = products.find(x => x.id === e.target.dataset.pid);
                if(p) {
                    if(!p.matrixOverrides) p.matrixOverrides = {};
                    p.matrixOverrides[e.target.dataset.key] = e.target.value;
                    showToast("จำราคาพิเศษรายชิ้นแล้ว");
                }
            };
        });

        document.querySelectorAll('.formula-select').forEach(sel => {
            sel.onchange = (e) => {
                const p = products.find(x => x.id === e.target.dataset.id);
                if(p) {
                    p.formulaId = e.target.value;
                    p.matrixOverrides = {}; 
                    renderProducts();
                }
            };
        });
    }

    async function loadData() {
        showToast("⏳ กำลังโหลด...");
        try {
            const res = await fetch(`${GOOGLE_SHEET_URL}?action=load`);
            const data = await res.json();
            categories = data.categories || [];
            volumeFormulas = (data.formulas || []).map(f => ({...f, breaks: JSON.parse(f.breaks || '[]')}));
            products = (data.products || []).map(p => ({
                ...p, 
                matrixOverrides: p.matrixOverrides ? JSON.parse(p.matrixOverrides) : {} 
            }));
            renderProducts();
            
            const filterSel = document.getElementById('categoryFilterSelect');
            if(filterSel) {
                filterSel.innerHTML = '<option value="all">ทั้งหมด</option>' + categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            }
            showToast("✅ ข้อมูลอัปเดตแล้ว");
        } catch(e) { 
            console.error(e);
            showToast("❌ โหลดข้อมูลไม่สำเร็จ"); 
        }
    }

    async function saveAll() {
        showToast("⏳ กำลังบันทึก...");
        const payload = {
            type: 'all',
            records: {
                categories: categories,
                formulas: volumeFormulas.map(f => ({...f, breaks: JSON.stringify(f.breaks)})),
                products: products.map(p => ({
                    ...p,
                    matrixOverrides: JSON.stringify(p.matrixOverrides || {})
                }))
            }
        };
        try {
            await fetch(GOOGLE_SHEET_URL, { method: 'POST', body: JSON.stringify(payload) });
            showToast("🚀 บันทึกไป Sheets สำเร็จ!");
        } catch(e) { 
            console.error(e);
            showToast("❌ บันทึกไม่สำเร็จ"); 
        }
    }

    // แก้ไขปัญหา TypeError: Cannot set properties of null (setting 'onclick')
    // โดยการใช้ DOMContentLoaded เพื่อรอให้ Element ถูกสร้างเสร็จก่อน
    window.addEventListener('DOMContentLoaded', () => {
        const saveBtn = document.getElementById('saveToSheetsBtn');
        if(saveBtn) saveBtn.onclick = saveAll;

        const loadBtn = document.getElementById('loadFromSheetsBtn');
        if(loadBtn) loadBtn.onclick = loadData;

        const refreshBtn = document.getElementById('refreshBtn');
        if(refreshBtn) refreshBtn.onclick = () => location.reload();

        const searchInp = document.getElementById('searchProduct');
        if(searchInp) searchInp.oninput = renderProducts;

        const filterSel = document.getElementById('categoryFilterSelect');
        if(filterSel) filterSel.onchange = (e) => { currentCategoryFilter = e.target.value; renderProducts(); };

        const manageBtn = document.getElementById('manageFormulasBtn');
        if(manageBtn) manageBtn.onclick = () => {
            const modal = document.getElementById('formulaManagerModal');
            if(modal) modal.classList.remove('hidden');
        };

        const closeBtn = document.getElementById('closeFormulaModalBtn');
        if(closeBtn) closeBtn.onclick = () => {
            const modal = document.getElementById('formulaManagerModal');
            if(modal) modal.classList.add('hidden');
        };

        // เริ่มโหลดข้อมูลทันทีเมื่อ DOM พร้อม
        loadData();
    });
</script>
</body>
</html>
